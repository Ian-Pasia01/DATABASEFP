<section id="admin-login">
    <h1>Admin Login</h1>
    <p>Please enter your admin credentials to access the system.</p>

    <form method="POST">
        {{ form.csrf_token }}
        {{ form.AdminUser.label }}
        {{ form.AdminUser() }}
    <br>
        {{ form.passw.label }}
        {{ form.passw() }}
    <br>
        {{ form.submit() }}
    </form>

    <p><a href="{{ url_for('user_login') }}">User Login</a></p>
</section>
