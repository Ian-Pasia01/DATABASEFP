<h2>Edit Appointment</h2>

<form method="POST">
    <label>Patient:</label>
    <select name="patient_id" required>
        {% for patient in patients %}
        <option value="{{ patient.id }}" {% if appointment.patient_id == patient.id %}selected{% endif %}>
            {{ patient.full_name }}
        </option>
        {% endfor %}
    </select>

    <label>Doctor Name:</label>
    <input type="text" name="doctor_name" value="{{ appointment.doctor_name }}" required>

    <label>Date:</label>
    <input type="date" name="date" value="{{ appointment.date }}" required>

    <label>Time:</label>
    <input type="time" name="time" value="{{ appointment.time }}" required>

    <label for="staff">Assign Staff:</label>
    <select name="staff_id" id="staff">
        <option value="">Select Staff</option>
        {% for member in staff %}
        <option value="{{ member.id }}" {% if member.id == appointment.staff_id %}selected{% endif %}>{{ member.name }} ({{ member.role }})</option>
        {% endfor %}
    </select>

    <label>Status:</label>
    <select name="status">
        <option value="Pending" {% if appointment.status == 'Pending' %}selected{% endif %}>Pending</option>
        <option value="Completed" {% if appointment.status == 'Completed' %}selected{% endif %}>Completed</option>
        <option value="Cancelled" {% if appointment.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
    </select>

    <button type="submit">Update Appointment</button>
</form>
