{% extends "base.html" %}

{% block title %}Edit Patient{% endblock %}

{% block content %}
<section id="edit-patient">
    <h1>Edit Patient</h1>
    <form method="POST">
        <div>
            <label for="full_name">Full Name:</label>
            <input type="text" id="full_name" name="full_name" value="{{ patient.full_name }}" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ patient.email }}" required>
        </div>
        <div>
            <label for="phone_number">Phone Number:</label>
            <input type="text" id="phone_number" name="phone_number" value="{{ patient.phone_number }}">
        </div>
        <div>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="{{ patient.address }}">
        </div>
        <div>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
            </select>
        </div>
        <div>
            <label for="date_of_birth">Date of Birth:</label>
            <input type="date" id="date_of_birth" name="date_of_birth" value="{{ patient.date_of_birth.strftime('%Y-%m-%d') if patient.date_of_birth else '' }}">
        </div>
        <div>
            <label for="blood_type">Blood Type:</label>
            <input type="text" id="blood_type" name="blood_type" value="{{ patient.blood_type }}">
        </div>
        <div>
            <label for="height">Height:</label>
            <input type="number" step="0.01" id="height" name="height" value="{{ patient.height }}">
        </div>
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" value="{{ patient.age }}">
        </div>
        <div>
            <label for="country_origin">Country of Origin:</label>
            <input type="text" id="country_origin" name="country_origin" value="{{ patient.country_origin }}">
        </div>
        <button type="submit">Update Patient</button>
    </form>
    <a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>
</section>
{% endblock %}
