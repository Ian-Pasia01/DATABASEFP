{% extends "base.html" %}

{% block title %}Sign Up - CarePoint{% endblock %}

{% block content %}
<section id="signup">
    <h2>Patient Sign Up</h2>
    <form action="{{ url_for('user_signup') }}" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>

        <label for="full_name">Full Name:</label>
        <input type="text" id="full_name" name="full_name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone_number">Phone Number:</label>
        <input type="tel" id="phone_number" name="phone_number" required>

        <label for="address">Address:</label>
        <textarea id="address" name="address" required></textarea>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label for="date_of_birth">Date of Birth (Optional):</label>
        <input type="date" id="date_of_birth" name="date_of_birth">

        <label for="country_origin">Country of Origin:</label>
        <input type="text" id="country_origin" name="country_origin" required>

        <label for="blood_type">Blood Type:</label>
        <select id="blood_type" name="blood_type">
            <option value="">Select Blood Type</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <label for="height">Height (e.g., 5'10"):</label>
        <input type="text" id="height" name="height" placeholder="e.g., 5'10"">

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="120">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Sign Up</button>
    </form>
</section>
{% endblock %}
